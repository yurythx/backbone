name: Deploy to Production

on:
  push:
    branches: [main]
    # Deploy por tag: git tag v1.2.3 && git push --tags
    tags:
      - "v*.*.*"

  # Trigger manual pela UI do GitHub
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite 'deploy' para confirmar o deploy em produção"
        required: true

jobs:
  # Guard: trigger manual exige confirmação
  guard:
    name: Deployment guard
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.confirm == 'deploy'
    steps:
      - name: Confirm deploy
        run: echo "Deploy confirmado para ${{ github.sha }}"

  deploy:
    name: Deploy no servidor de produção
    runs-on: ubuntu-latest
    needs: guard
    environment: production  # Requer aprovação de reviewer no GitHub Settings

    steps:
      - uses: actions/checkout@v4

      - name: Definir APP_VERSION
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${VERSION}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            echo "=== Backbone Deploy ==="
            echo "Version: ${{ steps.version.outputs.version }}"
            echo "Commit: ${{ github.sha }}"
            echo "Por: ${{ github.actor }}"

            # Navegar para o projeto
            cd ${{ secrets.DEPLOY_PATH || '/opt/backbone' }}

            # Pull do código
            git pull origin main

            export APP_VERSION=${{ steps.version.outputs.version }}

            # Build das imagens (sem cache para garantir atualização)
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              build --no-cache backend frontend

            # Migrar antes de trocar os containers
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              run --rm backend python manage.py migrate --no-input

            # Subir novos containers (Docker só reinicia os que mudaram)
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --remove-orphans

            # Health check: aguarda o backend responder (via porta local 8005)
            echo "Aguardando health check do backend..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8005/api/core/health/ > /dev/null; then
                echo "Backend está saudável!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "ERRO: Backend não ficou saudável a tempo!"
                docker compose -f docker-compose.prod.yml --env-file .env.prod \
                  logs backend --tail=50
                exit 1
              fi
              sleep 2
            done

            # Collectstatic
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              exec -T backend python manage.py collectstatic --noinput

            # Limpar imagens antigas
            docker image prune -f

            echo "=== Deploy concluído! ==="

      - name: Notificar sucesso
        if: success()
        run: |
          echo "::notice title=Deploy Success::Versão ${{ steps.version.outputs.version }} deployada com sucesso"

      - name: Notificar falha
        if: failure()
        run: |
          echo "::error title=Deploy Failed::Deploy da versão ${{ steps.version.outputs.version }} FALHOU. Verifique os logs."
