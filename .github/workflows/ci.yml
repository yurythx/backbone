name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Ruff
        working-directory: ./backend
        run: ruff check .
        
      - name: Run Mypy
        working-directory: ./backend
        run: mypy .
        
      - name: Run Tests
        working-directory: ./backend
        run: python manage.py test
        env:
          SECRET_KEY: 'ci-test-key'
          DEBUG: 'True'
          DATABASE_URL: 'sqlite:///db.sqlite3'

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Run Lint
        working-directory: ./frontend
        run: npm run lint
        
      - name: Run Build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:8000'

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Backend Dockerfile
        run: docker build -t backbone-backend-test ./backend --target development
        
      - name: Check Frontend Dockerfile
        run: docker build -t backbone-frontend-test ./frontend --target deps
