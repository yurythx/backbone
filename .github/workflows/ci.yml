name: CI

on:
  push:
    branches:
      - sprint-1/correcoes-criticas
      - main
      - master
  pull_request:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.1.14 black==23.12.1 isort==5.12.0 pre-commit
      - name: Ruff lint
        run: |
          ruff check backend apps || true
      - name: Black check
        run: |
          black --check backend || true
      - name: Run pre-commit (all files)
        run: |
          pre-commit run --all-files || true

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: dummy
        run: |
          python manage.py test
